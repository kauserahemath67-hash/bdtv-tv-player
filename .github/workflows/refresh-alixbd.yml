name: Refresh RS Live TV links

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the data-storage branch
        uses: actions/checkout@v4
        with:
          ref: data-storage

      - name: Refresh alixbd URLs in data/channels.json
        run: python3 tools/refresh_alixbd.py data/channels.json

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- data/channels.json tools/source_stats.json)" ]; then
            echo "No changes — all alixbd links already fresh."
          else
            git add data/channels.json tools/source_stats.json
            git commit -m "chore: refresh RS links"
            git push origin HEAD:data-storage
          fi
